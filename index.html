<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1026">
  <meta name="description" content="孩子的星际英语学习站：打卡、拼词、收集星际贴纸、养成机器伙伴">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>星际英语站 🚀</title>
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
  <canvas id="starfield"></canvas>

  <header id="topbar">
    <div class="logo">🚀 星际英语站</div>
    <div class="top-stats">
      <span id="top-coins" class="chip">🪙 0</span>
      <button id="btn-sound" class="chip" title="声音开关">🔊</button>
    </div>
  </header>

  <main id="main">
    <section id="screen-home" class="screen active">
      <div class="greet">
        <div id="greet-title">你好，小宇航员！</div>
        <div id="greet-date"></div>
      </div>

      <div class="card pet-card">
        <div id="pet-wrap"></div>
        <div class="pet-info">
          <div id="pet-bubble">今天也一起加油呀！</div>
          <div id="pet-name"></div>
          <div id="pet-stage"></div>
          <div id="pet-progress"></div>
          <button id="btn-feed" class="btn btn-gold">🍞 喂能量块</button>
        </div>
      </div>

      <div class="row2">
        <div class="card streak-card">
          <div class="big" id="streak-num">0</div>
          <div style="font-weight:700">连续航行</div>
          <div id="rank-line" style="font-weight:700;font-size:13px;color:#ffcf5c"></div>
          <div id="streak-shields" class="tiny"></div>
        </div>
        <div class="card quest-card">
          <div class="qc-title">📋 今日任务</div>
          <div class="bar-row">新词 <div class="bar"><i id="bar-new"></i></div> <span id="txt-new">0/4</span></div>
          <div class="bar-row">复习 <div class="bar"><i id="bar-rev"></i></div> <span id="txt-rev">0/10</span></div>
          <button id="btn-quest" class="btn btn-main">🚀 开始冒险</button>
        </div>
      </div>

      <div id="weak-slot"></div>
    </section>

    <section id="screen-quest" class="screen"><div id="quest-root"></div></section>
    <section id="screen-album" class="screen"><div id="album-root"></div></section>
    <section id="screen-calendar" class="screen"><div id="calendar-root"></div></section>
    <section id="screen-parent" class="screen"><div id="parent-root"></div></section>
  </main>

  <nav id="bottomnav">
    <button data-nav="home" class="active"><span class="ni">🏠</span><span class="nl">空间站</span></button>
    <button data-nav="album" id="nav-album"><span class="ni">🌌</span><span class="nl">图鉴</span></button>
    <button data-nav="calendar"><span class="ni">📅</span><span class="nl">航行日志</span></button>
    <button data-nav="parent"><span class="ni">⚙️</span><span class="nl">家长</span></button>
  </nav>

  <div id="fx-layer"></div>
  <div id="modal-root"></div>
  <div id="toast"></div>

  <script src="js/data.js?v=5"></script>
  <script src="js/audio.js?v=5"></script>
  <script src="js/store.js?v=5"></script>
  <script src="js/ui-kit.js?v=5"></script>
  <script src="js/ui-screens.js?v=5"></script>
  <script src="js/ui-quest.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
